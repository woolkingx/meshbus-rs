id: dispatch.stream.round_trip_through_bus
owner: mesh-bus-core.dispatch
kind: service-composition
case: dispatch.stream.round_trip_through_bus
schema_ref: schemas/test-runtime.schema.json
input:
  target:
    host: example.com
    port: 443
  egresses:
    - id: echo
      protocol: test
      supports_stream: true
      supports_datagram: false
      max_payload_bytes: 1200
      groups: []
  scenario:
    packets:
      - seq: 0
        payload: hello
        note: "single-byte-stream request payload"
expect:
  open_ok: true
  exit_id: echo
  calls:
    echo: 1
  assertions:
    - kind: round_trip
      expected:
        payloads:
          - hello
observations: []
tags: []
