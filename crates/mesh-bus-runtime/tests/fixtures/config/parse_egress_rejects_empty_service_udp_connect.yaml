id: parse_egress_rejects_empty_service_udp_connect
owner: mesh-bus-runtime.config
kind: data-owner
case: config.parse_err
schema_ref: schemas/test-runtime.schema.json
input:
  yaml: |
    ingresses:
      - kind: Udp
        listen: 127.0.0.1:19092
        target: 198.51.100.1:53
    egresses:
      - kind: ServiceUdp
        id: dns-service
        service_id: local-dns
        connect: ""
        timeout_ms: 1000
expect:
  ok: false
  error_contains: "egress dns-service connect must not be empty"
observations: []
tags: []
