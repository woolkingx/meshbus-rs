input:
  yaml: |
    ingresses:
      - kind: Socks5
        listen: 127.0.0.1:19204
    egresses:
      - kind: Tcp
        id: direct
        timeout_ms: 1000
    pipeline:
      rule_chain_forward: /etc/mesh-bus/forward.yaml
