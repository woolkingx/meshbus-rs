id: parse_prometheus_http_metrics_config
owner: mesh-bus-runtime.config
kind: data-owner
case: config.parse_ok
schema_ref: schemas/test-runtime.schema.json
input:
  yaml: |
    metrics:
      kind: PrometheusHttp
      listen: 127.0.0.1:19100
    ingresses:
      - kind: Socks5
        listen: 127.0.0.1:19090
    egresses:
      - kind: Tcp
        id: direct
        timeout_ms: 1000
expect:
  ok: true
  debug_contains:
    - "PrometheusHttp"
    - "127.0.0.1:19100"
observations: []
tags: []
