id: direct_tcp_forward_reaches_tcp_egress
owner: mesh-bus-bin.e2e
kind: service-composition
case: e2e.roundtrip
schema_ref: schemas/test-runtime.schema.json
input:
  probe:
    kind: direct_tcp
    payload: "direct-tcp-smoke"
  yaml: |
    ingresses:
      - kind: Tcp
        listen: "{{TCP_LISTEN}}"
        target: "{{TCP_ECHO}}"
    egresses:
      - kind: Tcp
        id: direct
        timeout_ms: 1000
expect:
  ok: true
observations: []
tags: []
