id: binary_prometheus_http_metrics_exposes_dispatch_counters
owner: mesh-bus-bin.e2e
kind: service-composition
case: e2e.roundtrip
schema_ref: schemas/test-runtime.schema.json
input:
  probe:
    kind: socks5_tcp_then_metrics
    payload: "metrics-smoke"
    assert_metrics_contains:
      - 'mesh_bus_dispatch_total{exit_id="direct",wan_id="local"}'
      - 'mesh_bus_dispatch_success_total{exit_id="direct",wan_id="local"}'
  yaml: |
    metrics:
      kind: PrometheusHttp
      listen: "{{METRICS_LISTEN}}"
    ingresses:
      - kind: Socks5
        listen: "{{TCP_LISTEN}}"
    egresses:
      - kind: Tcp
        id: direct
        wan_id: local
        timeout_ms: 1000
expect:
  ok: true
observations: []
tags: []
