id: binary_socks5_udp_associate_relays_through_socks5_udp_egress
owner: mesh-bus-bin.e2e
kind: service-composition
case: e2e.roundtrip
schema_ref: schemas/test-runtime.schema.json
input:
  probe:
    kind: socks5_udp_via_upstream
    payload: "socks5-udp-upstream"
  yaml: |
    ingresses:
      - kind: Socks5
        listen: "{{TCP_LISTEN}}"
    egresses:
      - kind: Socks5Udp
        id: upstream-socks5-udp
        upstream: "{{UPSTREAM_SOCKS5_UDP}}"
        timeout_ms: 1000
expect:
  ok: true
observations: []
tags: []
