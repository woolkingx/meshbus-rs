id: mesh_peer_secure_udp_two_node_datagram_e2e
owner: mesh-bus-bin.product-topology
kind: service-composition
case: e2e.product_topology
schema_ref: schemas/test-runtime.schema.json
input:
  resources:
    - name: NODE_A_UDP
      kind: udp_addr
    - name: NODE_B_MESH
      kind: udp_addr
    - name: UDP_ECHO
      kind: udp_echo
    - name: CAPTURE_RELAY
      kind: udp_relay
      forward_to: "{{NODE_B_MESH}}"
      capture: true
  nodes:
    - name: node-b
      start_after_ms: 200
      config_yaml: |
        node:
          id: node-b
        peers:
          - id: peer-a
            node_id: node-a
            meshsec:
              profile: MeshSec-0RTT-PSK-XChaCha
              static_key_hex: "1111111111111111111111111111111111111111111111111111111111111111"
        ingresses:
          - kind: MeshPeerUdp
            listen: "{{NODE_B_MESH}}"
        egresses:
          - kind: Udp
            id: node-b-udp
            timeout_ms: 1000
    - name: node-a
      start_after_ms: 200
      config_yaml: |
        node:
          id: node-a
        peers:
          - id: parent-b
            node_id: node-b
            route_groups: [remote-udp]
            meshsec:
              profile: MeshSec-0RTT-PSK-XChaCha
              static_key_hex: "1111111111111111111111111111111111111111111111111111111111111111"
        ingresses:
          - kind: Udp
            listen: "{{NODE_A_UDP}}"
            target: "{{UDP_ECHO}}"
        egresses:
          - kind: MeshPeerUdp
            id: peer-b-udp
            peer_id: parent-b
            peer: "{{CAPTURE_RELAY}}"
            timeout_ms: 1000
            groups: [remote-udp]
  probe:
    kind: udp_roundtrip
    target: "{{NODE_A_UDP}}"
    payload: "secure-mesh-udp"
    timeout_ms: 2000
expect:
  echo_payload: "secure-mesh-udp"
  wire:
    capture: CAPTURE_RELAY
    fail_closed_target: "{{NODE_B_MESH}}"
    no_magic: "4d42"
    no_plaintext:
      - "secure-mesh-udp"
      - "remote-udp"
      - "127.0.0.1"
    tamper_fail_closed: true
    replay_fail_closed: true
observations: []
tags: []
