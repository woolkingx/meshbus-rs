id: socks5_large_connect_over_secure_mesh_peer_to_remote_socks5_egress_e2e
owner: mesh-bus-bin.product-topology
kind: service-composition
case: e2e.product_topology
schema_ref: schemas/test-runtime.schema.json
input:
  resources:
    - name: NODE_A_SOCKS
      kind: tcp_addr
    - name: NODE_B_MESH
      kind: udp_addr
    - name: RELAY
      kind: udp_relay
      forward_to: "{{NODE_B_MESH}}"
      capture: true
    - name: UPSTREAM_SOCKS5
      kind: socks5_stream_proxy
    - name: TCP_ECHO
      kind: tcp_echo
  nodes:
    - name: node-b
      start_after_ms: 200
      config_yaml: |
        node:
          id: node-b
        peers:
          - id: peer-a
            node_id: node-a
            meshsec:
              profile: MeshSec-0RTT-PSK-XChaCha
              static_key_hex: 1111111111111111111111111111111111111111111111111111111111111111
        ingresses:
          - kind: MeshPeerUdp
            listen: "{{NODE_B_MESH}}"
        egresses:
          - kind: Socks5
            id: node-b-socks5
            upstream: "{{UPSTREAM_SOCKS5}}"
            timeout_ms: 1000
    - name: node-a
      start_after_ms: 200
      config_yaml: |
        node:
          id: node-a
        peers:
          - id: parent-b
            node_id: node-b
            route_groups: [mesh-upstream]
            meshsec:
              profile: MeshSec-0RTT-PSK-XChaCha
              static_key_hex: 1111111111111111111111111111111111111111111111111111111111111111
        ingresses:
          - kind: Socks5
            listen: "{{NODE_A_SOCKS}}"
        egresses:
          - kind: MeshPeerUdp
            id: peer-b
            peer_id: parent-b
            peer: "{{RELAY}}"
            timeout_ms: 1000
            groups: [mesh-upstream]
  probe:
    kind: socks5_tcp_sized
    listen: "{{NODE_A_SOCKS}}"
    target: "{{TCP_ECHO}}"
    size_bytes: 4096
expect:
  wire:
    capture: RELAY
    no_magic: "4d42"
    no_plaintext:
      - "mesh-upstream"
      - "127.0.0.1"
observations: []
tags: []
